<!doctype html>
<html lang="ar" dir="rtl">
<head>

<meta name="description" content="متابعة خطة حفظ القرآن الكريم — الحصون الخمسة">
<title>متابعة الحفظ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>
:root{
  --bg:#F3F2EE; --card:#FFFFFF; --ink:#1B2421; --muted:#5B6762; --line:#ECEBE6; --line2:#D9D6CD;
  --pri:#0E4D40; --pri-ink:#FFFFFF; --pri-soft:#E3EFEA; --pri-2:#145C4D; --pri-3:#2E6E60; --on-pri-muted:#CFE3DC;
  --gold:#E2B65C; --gold-ink:#3D2A05; --warn:#C98A1A; --warn-ink:#8A5A0B; --warn-soft:#FBF6EA;
  --bad:#B4442C; --bad-soft:#F6E3DE; --bad-ink:#8A2E1C; --off:#ECEBE6; --off-ink:#8C9692;
  --shadow:0 10px 30px rgba(0,0,0,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1513; --card:#18211E; --ink:#E7ECEA; --muted:#9AA7A2; --line:#24302C; --line2:#33413C;
    --pri:#2E8A73; --pri-ink:#FFFFFF; --pri-soft:#1C3A32; --pri-2:#123E35; --pri-3:#2B5E52; --on-pri-muted:#BFD8CF;
    --warn-soft:#2A2416; --bad-soft:#3A201A; --bad-ink:#F0A796; --off:#26302D; --off-ink:#7E8B86; --warn-ink:#E2B65C;
  }
  :root:not([data-theme="light"]) .hero{background:#123E35}
}
:root[data-theme="dark"]{
  --bg:#0F1513; --card:#18211E; --ink:#E7ECEA; --muted:#9AA7A2; --line:#24302C; --line2:#33413C;
  --pri:#2E8A73; --pri-ink:#FFFFFF; --pri-soft:#1C3A32; --pri-2:#123E35; --pri-3:#2B5E52; --on-pri-muted:#BFD8CF;
  --warn-soft:#2A2416; --bad-soft:#3A201A; --bad-ink:#F0A796; --off:#26302D; --off-ink:#7E8B86; --warn-ink:#E2B65C;
}
:root[data-theme="dark"] .hero{background:#123E35}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',system-ui,'Segoe UI',Tahoma,sans-serif}
body{min-height:100vh}
button,input,textarea,select{font-family:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.amiri{font-family:'Amiri',serif;font-weight:700}
.hero{background:var(--pri);color:var(--pri-ink);padding:calc(18px + env(safe-area-inset-top)) 18px 20px;border-radius:0 0 24px 24px;display:flex;flex-direction:column;gap:14px}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hero small{color:var(--on-pri-muted);font-size:13px}
.hero h1{margin:0;font-size:28px;line-height:1.2}
.iconbtn{width:44px;height:44px;border-radius:22px;border:1px solid var(--pri-3);background:transparent;color:inherit;display:flex;align-items:center;justify-content:center;flex:none}
.iconbtn.plain{border:0}
.iconbtn:disabled{opacity:.35}
.hero-card{display:flex;align-items:center;gap:16px;background:var(--pri-2);border-radius:16px;padding:14px 16px}
.page-head{padding:calc(20px + env(safe-area-inset-top)) 18px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.page-head h1{margin:0;font-size:26px}
.page-head .sub{font-size:13px;color:var(--muted)}
.content{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.section-label{font-size:12px;font-weight:600;color:var(--muted);padding:4px 4px 0}
.card{background:var(--card);border-radius:14px}
.pad{padding:14px}
.list>*+*{border-top:1px solid var(--line)}
.task{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 14px;min-height:60px}
.task .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;background:none;border:0;padding:6px 0;text-align:right}
.task .t{font-size:15px;font-weight:600}
.task .s{font-size:12.5px;color:var(--muted)}
.task.hl{background:var(--warn-soft)}
.list>.task:first-child{border-radius:14px 14px 0 0}
.list>.task:last-child{border-radius:0 0 14px 14px}
.list>.task:only-child{border-radius:14px}
.chk{width:44px;height:44px;border:0;background:none;padding:0;display:flex;align-items:center;justify-content:center;flex:none}
.dot{width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center}
.dot.none{border:2px solid #A9B2AE}
.dot.done{background:var(--pri)}
.dot.partial{border:2px solid var(--warn)}
.dot.partial::after{content:"";width:12px;height:12px;border-radius:6px;background:var(--warn)}
.dot.missed{background:var(--bad)}
.counter{font-size:12px;font-weight:600;color:var(--warn-ink);flex:none}
.counter.ok{color:var(--pri)}
.bars{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.bars span{width:16px;height:6px;border-radius:3px;background:var(--off)}
.bars span.on{background:var(--warn)}
.bars.ok span.on{background:var(--pri)}
.pill-btn{min-height:36px;padding:0 14px;border-radius:18px;background:var(--pri);color:var(--pri-ink);font-size:13px;font-weight:600;border:0;flex:none}
.pill-btn.ghost{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.banner{display:flex;align-items:center;gap:10px;background:var(--bad-soft);color:var(--bad-ink);border-radius:14px;padding:12px 14px;border:0;text-align:right;font-size:14px;font-weight:600;width:100%}
.banner.info{background:var(--pri-soft);color:var(--pri)}
.empty{padding:28px 18px;text-align:center;color:var(--muted);font-size:14px;line-height:1.8}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{background:var(--card);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-size:22px}
.stat span{font-size:12px;color:var(--muted)}
.grid-head,.grid-row{display:grid;grid-template-columns:64px repeat(5,minmax(0,1fr));gap:6px;align-items:center}
.grid-head{font-size:11px;color:var(--muted);text-align:center}
.grid-row{border:0;background:none;padding:3px 0;width:100%;text-align:right}
.grid-row .dn{font-size:13px;font-weight:500}
.grid-row.today .dn{color:var(--pri);font-weight:700}
.cell{height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.cell.done{background:var(--pri);color:#fff}
.cell.partial{background:var(--gold);color:var(--gold-ink)}
.cell.missed{background:var(--bad);color:#fff}
.cell.off{background:var(--off);color:var(--off-ink)}
.cell.future{background:transparent;border:1.5px dashed var(--line2);color:var(--off-ink)}
.cell.unlogged{background:transparent;border:1.5px solid var(--bad);color:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:var(--muted);padding-top:8px;border-top:1px solid var(--line)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:4px;vertical-align:middle}
.track{height:8px;border-radius:4px;background:var(--off);overflow:hidden}
.track>div{height:100%;border-radius:4px}
.juzmap{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px}
.juz{height:22px;border-radius:5px;background:var(--pri-3);position:relative;overflow:hidden;font-size:10px;display:flex;align-items:center;justify-content:center;color:var(--on-pri-muted)}
.juz>i{position:absolute;inset:0 0 0 auto;background:var(--gold)}
.juz>em{position:relative;font-style:normal}
.juz.full{color:var(--gold-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line2);background:var(--card);font-size:13px}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.chip.bad{background:var(--bad-soft);color:var(--bad-ink);border-color:transparent;font-weight:600;text-decoration:none;display:inline-flex;align-items:center}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seg button{min-height:46px;border-radius:12px;border:1px solid var(--line2);background:var(--card);font-size:14px}
.seg button.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
.seg button.on.partial{background:var(--warn);border-color:var(--warn)}
.seg button.on.missed{background:var(--bad);border-color:var(--bad)}
.seg.q button.on{background:var(--pri-soft);color:var(--pri);border:2px solid var(--pri)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:44px;height:44px;border-radius:22px;border:1px solid var(--line2);background:var(--card);font-size:20px}
.stepper b{font-size:20px;min-width:28px;text-align:center}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;font-size:15px}
.field input[type=date],.field select{border:1px solid var(--line2);border-radius:10px;min-height:42px;padding:0 10px;font-size:14px;background:var(--card)}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--pri)}
textarea{width:100%;border-radius:12px;border:1px solid var(--line2);padding:10px;font-size:14px;resize:vertical;background:var(--card);min-height:70px}
.menu-btn{min-height:50px;border:0;background:transparent;font-size:15px;text-align:right;padding:0 14px;display:flex;align-items:center;gap:10px;width:100%}
.menu-btn.danger{color:var(--bad)}
.week-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;background:none;width:100%;text-align:right}
.wnum{width:42px;height:42px;border-radius:12px;background:var(--off);color:var(--muted);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}
.wnum.past{background:var(--pri-soft);color:var(--pri)}
.wnum.cur{background:var(--pri);color:#fff}
.week-card.cur{outline:2px solid var(--pri)}
.dayline{display:grid;grid-template-columns:62px minmax(0,1fr) 16px;gap:8px;align-items:center;padding:8px 14px;font-size:12.5px;border:0;background:none;width:100%;text-align:right;border-top:1px solid var(--line)}
.dayline .sm{width:12px;height:12px;border-radius:6px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:0 12px;min-height:46px;color:var(--muted)}
.search input{border:0;outline:none;flex:1;font-size:15px;background:transparent;min-height:44px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:6px 8px calc(8px + env(safe-area-inset-bottom));z-index:5}
nav.tabs>div{display:contents}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:50px;justify-content:center;border:0;background:none;color:var(--off-ink);font-size:11px}
.tab.on{color:var(--pri);font-weight:700}
@media (min-width:560px){nav.tabs{max-width:520px;margin:0 auto;border-radius:16px 16px 0 0}}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:10px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);animation:up .2s ease-out}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 4px}
.sheet-hero{background:var(--pri);color:#fff;border-radius:18px;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-hero small{color:var(--on-pri-muted);font-size:13px}
.sheet-hero a{min-height:40px;padding:0 12px;border-radius:20px;border:1px solid #4A8576;color:#fff;font-size:13px;text-decoration:none;display:flex;align-items:center;gap:6px;flex:none}
.save{min-height:52px;border-radius:14px;background:var(--pri);color:#fff;font-size:16px;font-weight:700;border:0;width:100%}
.toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#1B2421;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;box-shadow:var(--shadow);max-width:90vw}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.muted{color:var(--muted)}
.small{font-size:12px}
a{color:var(--pri)}
</style>

/* ---------- App state ---------- */
const V={tab:'today',day:null,week:null,openWeek:null,q:''};
function curDay(){if(V.day==null){const t=todayIdx();V.day=Math.min(Math.max(t,firstIdx()),PLAN.length-1)}return V.day}
function applyTheme(){const t=S.settings.theme;if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t);
  const m=document.querySelector('meta[name=theme-color]');m.content=(t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches))?'#123E35':'#0E4D40'}

function render(){
  applyTheme();
  const app=$('#app');
  app.innerHTML=V.tab==='today'?viewToday():V.tab==='week'?viewWeek():V.tab==='stats'?viewStats():V.tab==='plan'?viewPlan():viewSettings();
  $('#tabs').innerHTML=[['today','اليوم',IC.t_today],['week','الأسبوع',IC.t_week],['stats','التقدم',IC.t_stats],['plan','الخطة',IC.t_plan]].map(([k,l,ic])=>'<button class="tab'+(V.tab===k||(k==='plan'&&V.tab==='settings')?' on':'')+'" data-act="tab" data-v="'+k+'"'+(V.tab===k?' aria-current="page"':'')+'>'+ic+l+'</button>').join('');
  if(V.tab==='plan'&&V.scrollWeek){const el=document.getElementById('wk'+V.scrollWeek);if(el)el.scrollIntoView({block:'center'});V.scrollWeek=null}
}

/* ---------- Today ---------- */
function viewToday(){
  const ti=todayIdx();const i=curDay();
  if(ti<firstIdx()&&i===Math.max(ti,firstIdx())&&V.day===firstIdx()&&!V.browsed){
    const n=firstIdx()-ti;
    return '<div class="hero"><div class="hero-top"><div><small>'+fmtG.format(today0())+'</small><h1 class="amiri">لم تبدأ الخطة بعد</h1></div>'+gearBtn()+'</div><div class="hero-card"><div style="display:flex;flex-direction:column;gap:4px"><b style="font-size:17px">تبدأ '+(n===1?'بكرة':n===2?'بعد يومين':'بعد '+n+(n<=10?' أيام':' يوم'))+'</b><small>يوم '+WEEKDAYS[startDate().getDay()]+' '+fmtG.format(startDate())+'</small></div></div></div>'+
      '<div class="content"><button class="banner info" data-act="peek">اعرض مهام اليوم الأول'+'</button><div class="empty">تقدر تغيّر تاريخ البداية في أي وقت من الإعدادات.</div></div>';
  }
  if(i>=PLAN.length){return '<div class="hero"><h1 class="amiri">تمت الخطة</h1></div>'}
  const p=PLAN[i];const d=dateOf(i);const t=tasksOf(i);
  const done=t.filter(x=>statusOf(i,x.id)==='done').length;
  const ratio=dayRatio(i)||0;const pct=Math.round(ratio*100);
  const mem=memorizedSet().size;
  const isToday=i===ti;
  const rel=isToday?'اليوم':i===ti-1?'أمس':i===ti+1?'غدًا':fmtGs.format(d);
  const C=2*Math.PI*27;
  let h='<div class="hero"><div class="hero-top">'+
    '<button class="iconbtn plain" data-act="day" data-v="-1" aria-label="اليوم السابق"'+(i<=firstIdx()?' disabled':'')+'>'+IC.prev+'</button>'+
    '<div style="flex:1;text-align:center;display:flex;flex-direction:column;gap:2px"><small>الأسبوع '+p.w+' · اليوم '+(p.d+1)+' من 7</small><h1 class="amiri">'+WEEKDAYS[d.getDay()]+(isToday?'':' <span style="font-size:16px;font-family:IBM Plex Sans Arabic;font-weight:500">('+rel+')</span>')+'</h1><small>'+fmtG.format(d)+(hijri(d)?' · '+hijri(d):'')+'</small></div>'+
    '<button class="iconbtn plain" data-act="day" data-v="1" aria-label="اليوم التالي"'+(i>=PLAN.length-1?' disabled':'')+'>'+IC.next+'</button></div>'+
    '<div class="hero-card"><svg role="img" aria-label="إنجاز '+pct+'%" width="64" height="64" viewBox="0 0 64 64" style="flex:none"><circle cx="32" cy="32" r="27" fill="none" stroke="var(--pri-3)" stroke-width="7"/><circle cx="32" cy="32" r="27" fill="none" stroke="#E2B65C" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+(C*ratio).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 32 32)"/><text x="32" y="37" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">'+pct+'%</text></svg>'+
    '<div style="display:flex;flex-direction:column;gap:4px;flex:1"><b style="font-size:16px">أنجزت '+done+' من '+t.length+' مهام</b><small>المحفوظ: '+mem+' وجه من 604 · '+Math.round(mem/604*100)+'%</small></div>'+
    (isToday?'':'<button class="pill-btn" style="background:#fff;color:#0E4D40" data-act="goToday">اليوم</button>')+'</div></div><div class="content">';
  if(isToday){const b=backlog();if(b.length)h+='<button class="banner" data-act="tab" data-v="week">'+IC.alert+'<span style="flex:1">عندك '+b.length+' '+(b.length<=10&&b.length>2?'مهام متأخرة':'مهمة متأخرة')+' للقضاء</span>'+IC.next+'</button>'}
  if(isToday&&needBackupNudge())h+='<button class="banner info" data-act="backup">'+IC.dl+'<span style="flex:1">مر أسبوع من غير نسخة احتياطية — احفظ نسخة الآن</span></button>';
  for(let f=1;f<=5;f++){
    const g=t.filter(x=>x.f===f);if(!g.length)continue;
    h+='<div class="section-label">'+FORTS[f]+'</div><div class="card list">'+g.map(x=>taskRow(i,x)).join('')+'</div>';
  }
  if(p.new==null&&(d.getDay()===5||d.getDay()===6||p.d>=5))h+='<div class="empty" style="padding:8px">لا يوجد حفظ جديد اليوم حسب الجدول.</div>';
  return h+'</div>';
}
function gearBtn(){return '<button class="iconbtn" data-act="tab" data-v="settings" aria-label="الإعدادات">'+IC.gear+'</button>'}
function taskRow(i,x){
  const e=entry(i,x.id)||{};const st=e.status||null;
  let extra='';
  if(x.target){const c=e.count||0;extra='<div class="bars'+(c>=x.target?' ok':'')+'">'+Array.from({length:x.target},(_,k)=>'<span class="'+(k<c?'on':'')+'"></span>').join('')+'</div>'}
  let right='';
  if(x.target)right='<span class="counter'+((e.count||0)>=x.target?' ok':'')+'">'+(e.count||0)+'/'+x.target+'</span>';
  if(x.detailed&&!st)right='<button class="pill-btn" data-act="open" data-id="'+x.id+'">سجّل</button>';
  if(x.detailed&&st&&e.quality)right='<span class="counter ok">'+({good:'متقن',ok:'جيد',weak:'ضعيف'}[e.quality])+'</span>';
  const note=e.note?'<span class="s" style="color:var(--warn-ink)">✎ '+esc(e.note.slice(0,40))+(e.note.length>40?'…':'')+'</span>':'';
  return '<div class="task'+(x.key&&!st?' hl':'')+'"><button class="chk" data-act="quick" data-id="'+x.id+'" aria-label="'+(st==='done'?'إلغاء التعليم':'تعليم كمنجز')+': '+esc(x.title)+'">'+dotHtml(st)+'</button>'+
    '<button class="main" data-act="open" data-id="'+x.id+'"><span class="t">'+esc(x.title)+'</span><span class="s">'+esc(x.sub)+'</span>'+extra+note+'</button>'+right+'</div>';
}

/* ---------- Sheet ---------- */
let SH=null;
function openSheet(i,id){
  const x=tasksOf(i).find(t=>t.id===id);if(!x)return;
  const e=entry(i,id)||{};
  SH={i,x,status:e.status||null,count:e.count||0,quality:e.quality||null,mistakes:e.mistakes||0,reason:e.reason||null,carry:e.carry!==false,note:e.note||''};
  drawSheet();
}
function drawSheet(){
  const {i,x}=SH;const d=dateOf(i);
  const reasons=['ضيق الوقت','سفر / عمل','صعوبة الوجه','مرض','نسيت'];
  let h='<div class="overlay" data-act="closeSheet"><div class="sheet" role="dialog" aria-modal="true" aria-label="'+esc(x.title)+'" data-stop="1"><div class="grab"></div>'+
   '<div class="sheet-hero"><div style="display:flex;flex-direction:column;gap:2px;min-width:0"><small>'+FORTS[x.f]+' · '+WEEKDAYS[d.getDay()]+' '+fmtGs.format(d)+'</small><b class="amiri" style="font-size:24px">'+esc(x.title)+'</b><small>'+esc(x.sub)+'</small></div>'+
   (x.page?'<a href="'+quranUrl(x.page)+'" target="_blank" rel="noopener">'+IC.book+'المصحف</a>':'')+'</div>';
  h+='<div class="card pad" style="display:flex;flex-direction:column;gap:10px"><b style="font-size:14px">الحالة</b><div class="seg">'+
    [['done','تم'],['partial','جزئي'],['missed','لم يتم']].map(([k,l])=>'<button class="'+(SH.status===k?'on '+k:'')+'" data-act="sh-status" data-v="'+k+'" aria-pressed="'+(SH.status===k)+'">'+l+'</button>').join('')+'</div></div>';
  if(x.target){h+='<div class="card pad row"><span style="font-size:14px;font-weight:600">عدد المرات</span><div class="stepper"><button data-act="sh-count" data-v="-1" aria-label="إنقاص">−</button><b>'+SH.count+'</b><span class="muted">/ '+x.target+'</span><button data-act="sh-count" data-v="1" aria-label="زيادة">+</button></div></div>'}
  if(x.detailed){
    h+='<div class="card pad" style="display:flex;flex-direction:column;gap:12px"><div class="row"><b style="font-size:14px">جودة الحفظ</b><span class="small muted">عند التسميع</span></div><div class="seg q">'+
      [['good','متقن'],['ok','جيد'],['weak','ضعيف']].map(([k,l])=>'<button class="'+(SH.quality===k?'on':'')+'" data-act="sh-q" data-v="'+k+'" aria-pressed="'+(SH.quality===k)+'">'+l+'</button>').join('')+'</div>'+
      '<div class="row" style="border-top:1px solid var(--line);padding-top:12px"><span style="font-size:14px">عدد الأخطاء</span><div class="stepper"><button data-act="sh-m" data-v="-1" aria-label="إنقاص">−</button><b>'+SH.mistakes+'</b><button data-act="sh-m" data-v="1" aria-label="زيادة">+</button></div></div></div>';
  }
  if(SH.status==='partial'||SH.status==='missed'){
    h+='<div class="card pad" style="display:flex;flex-direction:column;gap:10px"><b style="font-size:14px">السبب</b><div class="chips">'+reasons.map(r=>'<button class="chip'+(SH.reason===r?' on':'')+'" data-act="sh-r" data-v="'+esc(r)+'">'+r+'</button>').join('')+'</div>'+
      '<label class="row" style="border-top:1px solid var(--line);padding-top:10px;font-size:14px"><span>ترحيل لقائمة المتأخرات للقضاء</span><input type="checkbox" id="sh-carry"'+(SH.carry?' checked':'')+'></label></div>';
  }
  h+='<label style="display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600">ملاحظة<textarea id="sh-note" rows="2" placeholder="مثلًا: تشابه مع وجه سابق، موضع أخطأت فيه…">'+esc(SH.note)+'</textarea></label>'+
    '<div style="display:flex;gap:8px"><button class="save" data-act="sh-save">حفظ</button>'+(entry(i,x.id)?'<button class="pill-btn ghost" style="min-height:52px;border-radius:14px" data-act="sh-clear">مسح</button>':'')+'</div></div></div>';
  $('#layer').innerHTML=h;
}
function closeSheet(){SH=null;$('#layer').innerHTML=''}
function syncSheetInputs(){if(!SH)return;const n=$('#sh-note');if(n)SH.note=n.value;const c=$('#sh-carry');if(c)SH.carry=c.checked}

/* ---------- Week ---------- */
function viewWeek(){
  const ti=todayIdx();
  if(V.week==null){const ci=Math.min(Math.max(ti,firstIdx()),PLAN.length-1);V.week=PLAN[ci].w}
  const w=V.week;const s=(w-1)*7;
  const p0=PLAN[s];
  let h='<div class="page-head"><button class="iconbtn plain" data-act="week" data-v="-1" aria-label="الأسبوع السابق"'+(w<=1?' disabled':'')+'>'+IC.prev+'</button><div style="text-align:center;display:flex;flex-direction:column"><h1 class="amiri">الأسبوع '+w+'</h1><span class="sub">'+fmtGs.format(dateOf(s))+' – '+fmtGs.format(dateOf(s+6))+(p0.weekly?' · تحضير '+r2(p0.weekly):'')+'</span></div><button class="iconbtn plain" data-act="week" data-v="1" aria-label="الأسبوع التالي"'+(w>=122?' disabled':'')+'>'+IC.next+'</button></div><div class="content">';
  // stats
  let sc=0,tot=0,newDone=0,newTot=0;
  for(let i=s;i<s+7;i++){if(!inPlan(i))continue;for(const x of tasksOf(i)){const st=statusOf(i,x.id);if(i<ti||st){sc+=score(st);tot++}if(x.id==='new'){newTot+=cnt(PLAN[i].new);if(st==='done')newDone+=cnt(PLAN[i].new)}}}
  const bl=backlog();
  h+='<div class="stats3"><div class="stat"><b style="color:var(--pri)">'+(tot?Math.round(sc/tot*100)+'%':'—')+'</b><span>نسبة الالتزام</span></div><div class="stat"><b>'+newDone+'/'+newTot+'</b><span>أوجه جديدة</span></div><div class="stat"><b style="color:'+(bl.length?'var(--bad)':'inherit')+'">'+bl.length+'</b><span>متأخرات (الكل)</span></div></div>';
  h+='<div class="card pad" style="display:flex;flex-direction:column;gap:6px"><div class="grid-head"><span></span>'+[1,2,3,4,5].map(f=>'<span>'+FORT_SHORT[f]+'</span>').join('')+'</div>';
  for(let i=s;i<s+7;i++){
    const d=dateOf(i);const t=tasksOf(i);
    h+='<button class="grid-row'+(i===ti?' today':'')+'" data-act="gotoDay" data-v="'+i+'" aria-label="افتح يوم '+WEEKDAYS[d.getDay()]+'"><span class="dn">'+WEEKDAYS[d.getDay()]+'</span>';
    for(let f=1;f<=5;f++){
      const g=t.filter(x=>x.f===f);let cls,lab;
      if(!g.length||!inPlan(i)){cls='off';lab='—'}
      else{const sts=g.map(x=>statusOf(i,x.id));const v=sts.reduce((a,st)=>a+score(st),0)/g.length;const any=sts.some(Boolean);
        if(v===1){cls='done';lab='✓'}else if(v>0){cls='partial';lab='½'}else if(sts.some(st=>st==='missed')){cls='missed';lab='×'}else if(i<ti&&!any){cls='unlogged';lab='؟'}else if(i<ti){cls='missed';lab='×'}else{cls='future';lab=''}}
      h+='<span class="cell '+cls+'">'+lab+'</span>';
    }
    h+='</button>';
  }
  h+='<div class="legend"><span><i style="background:var(--pri)"></i>تم</span><span><i style="background:var(--gold)"></i>جزئي</span><span><i style="background:var(--bad)"></i>لم يتم</span><span><i style="border:1.5px solid var(--bad)"></i>لم يُسجّل</span><span><i style="background:var(--off)"></i>لا يوجد مقرر</span></div></div>';
  h+='<div class="section-label">المتأخرات للقضاء</div>';
  if(!bl.length)h+='<div class="card empty">لا توجد متأخرات — بارك الله فيك.</div>';
  else h+='<div class="card list">'+(V.allBl?bl:bl.slice(0,8)).map(b=>{const d=dateOf(b.i);return '<div class="task"><span style="width:8px;height:8px;border-radius:4px;background:'+(b.e.status==='partial'?'var(--warn)':'var(--bad)')+';flex:none;margin-inline-start:6px"></span><button class="main" data-act="gotoDay" data-v="'+b.i+'"><span class="t">'+esc(b.task.title)+'</span><span class="s">'+esc(b.task.sub)+'</span><span class="s">'+WEEKDAYS[d.getDay()]+' '+fmtGs.format(d)+' · '+(b.e.status==='partial'?'جزئي':'لم يتم')+(b.e.reason?' · '+esc(b.e.reason):'')+'</span></button><button class="pill-btn ghost" data-act="resolve" data-i="'+b.i+'" data-id="'+b.task.id+'">تم قضاؤه</button></div>'}).join('')+'</div>'+(bl.length>8?'<button class="pill-btn ghost" style="align-self:center" data-act="allBl">'+(V.allBl?'عرض الأحدث فقط':'عرض الكل ('+bl.length+')')+'</button>':'');
  const ul=unloggedCount(Math.max(0,ti-7),ti);
  if(ul)h+='<div class="small muted" style="padding:0 4px">'+ul+' مهمة في آخر 7 أيام لم تُسجّل — افتح اليوم وسجّلها.</div>';
  return h+'</div>';
}

/* ---------- Stats ---------- */
function viewStats(){
  const ti=todayIdx();const mem=memorizedSet();const n=mem.size;
  const exp=expectedPages(Math.min(ti,PLAN.length));
  const diff=n-exp;
  const status=ti<firstIdx()?'لم تبدأ بعد':diff>=0?(diff>0?'متقدم '+diff+' وجه':'على الجدول'):'متأخر '+(-diff)+' وجه';
  const curW=ti<firstIdx()?1:Math.min(PLAN[Math.min(ti,PLAN.length-1)].w,122);
  let h='<div class="page-head"><div><h1 class="amiri">تقدمك في الخطة</h1><span class="sub">الأسبوع '+curW+' من 122</span></div></div><div class="content">';
  h+='<div class="hero" style="border-radius:18px;padding:16px"><div class="row" style="align-items:flex-end"><div style="display:flex;flex-direction:column"><small>المحفوظ</small><b style="font-size:30px">'+n+' <span style="font-size:15px;font-weight:500;color:var(--on-pri-muted)">/ 604 وجه</span></b></div><span style="font-size:13px;background:var(--pri-2);padding:5px 10px;border-radius:12px">'+status+'</span></div><div class="juzmap">';
  let fullJ=0;
  for(let j=1;j<=30;j++){const [a,b]=juzPages(j);let c=0;for(let x=a;x<=b;x++)if(mem.has(x))c++;const fr=c/(b-a+1);if(fr>=1)fullJ++;h+='<div class="juz'+(fr>=1?' full':'')+'" title="الجزء '+j+'"><i style="width:'+(fr*100).toFixed(0)+'%"></i><em>'+j+'</em></div>'}
  h+='</div><small>كل مربع = جزء · أتممت '+fullJ+' '+(fullJ>2&&fullJ<11?'أجزاء':'جزء')+'</small></div>';
  const st=streak();const remW=Math.max(0,122-curW);
  h+='<div class="stats2"><div class="stat"><b>'+st+' يوم</b><span>متتالية بإنجاز 80% فأكثر</span></div><div class="stat"><b>'+remW+' أسبوع</b><span>متبقي · الختم '+fmtG.format(dateOf(PLAN.length-1))+'</span></div></div>';
  const fs=fortScore(Math.max(0,ti-28),Math.min(ti+1,PLAN.length));
  h+='<div class="card pad" style="display:flex;flex-direction:column;gap:12px"><b style="font-size:14px">الالتزام بالحصون · آخر 4 أسابيع</b>';
  let any=false;
  for(let f=1;f<=5;f++){const [a,b]=fs[f];if(!b)continue;any=true;const v=Math.round(a/b*100);h+='<div style="display:flex;flex-direction:column;gap:5px"><div class="row" style="font-size:13px"><span>'+FORT_SHORT[f]+' — '+FORTS[f].split('·')[1]+'</span><b>'+v+'%</b></div><div class="track"><div style="width:'+v+'%;background:'+(v>=85?'var(--pri)':v>=60?'var(--warn)':'var(--bad)')+'"></div></div></div>'}
  if(!any)h+='<span class="muted small">هتظهر النسب بعد أول يوم تسجيل.</span>';
  h+='</div>';
  const wp=weakPages();
  h+='<div class="card pad" style="display:flex;flex-direction:column;gap:8px"><b style="font-size:14px">أوجه تحتاج تثبيت</b><span class="small muted">أوجه سجّلت جودتها «ضعيف» أو فيها 3 أخطاء فأكثر</span>'+(wp.length?'<div class="chips">'+wp.map(([p,i])=>'<button class="chip bad" data-act="weak" data-v="'+i+'">وجه '+p+'</button>').join('')+'</div><span class="small muted">اضغط على الوجه لفتح تسجيله — لما تثبّته عدّل الجودة لـ«متقن» والأخطاء لصفر وهيختفي من هنا.</span>':'<span class="small muted">لا يوجد — ما شاء الله.</span>')+'</div>';
  return h+'</div>';
}

/* ---------- Plan ---------- */
function weekInfo(w){
  const s=(w-1)*7;let lo=null,hi=null,sc=0,tot=0;const ti=todayIdx();
  for(let i=s;i<s+7;i++){const p=PLAN[i];if(!p)continue;if(p.new){lo=lo==null?p.new[0]:Math.min(lo,p.new[0]);hi=hi==null?p.new[1]:Math.max(hi,p.new[1])}
    if(inPlan(i)&&i<=ti)for(const x of tasksOf(i)){const st=statusOf(i,x.id);if(i<ti||st){sc+=score(st);tot++}}}
  return {lo,hi,pct:tot?Math.round(sc/tot*100):null,s};
}
function daySummary(i){const p=PLAN[i];const a=[];if(p.new)a.push('حفظ '+r2(p.new));else a.push('لا حفظ جديد');if(p.near)a.push('قريب '+r2(p.near).replace(' – ','–'));if(p.far)a.push('بعيد '+p.far.map(x=>r2(x).replace(' – ','–')).join(' و '));return a.join(' · ')}
function viewPlan(){
  const ti=todayIdx();const cw=ti<firstIdx()?1:ti>=PLAN.length?122:PLAN[ti].w;
  if(V.openWeek==null)V.openWeek=cw;
  let h='<div class="page-head"><div><h1 class="amiri">الخطة كاملة</h1><span class="sub">122 أسبوع · 604 وجه · تبدأ '+fmtG.format(startDate())+'</span></div>'+'<button class="iconbtn" style="background:var(--card);border:0;color:var(--ink)" data-act="tab" data-v="settings" aria-label="الإعدادات">'+IC.gear+'</button></div>';
  h+='<div style="padding:0 16px 6px"><label class="search">'+IC.search+'<input id="q" type="search" inputmode="numeric" placeholder="ابحث برقم الوجه… مثلًا 250" value="'+esc(V.q)+'" aria-label="بحث برقم الوجه"></label></div>';
  h+='<div class="content" id="planlist">';
  const q=parseInt(V.q,10);
  if(q>=1&&q<=604){
    const hits=[];PLAN.forEach((p,i)=>{if(p.new&&q>=p.new[0]&&q<=p.new[1])hits.push(i)});
    h+='<div class="card pad" style="display:flex;flex-direction:column;gap:8px"><b>وجه '+q+' · سورة '+surahOf(q)+' · الجزء '+juzOf(q)+'</b>'+
      hits.map(i=>{const d=dateOf(i);const st=statusOf(i,'new');return '<button class="week-row" style="padding:8px 0" data-act="gotoDay" data-v="'+i+'"><span class="wnum past">'+PLAN[i].w+'</span><span style="flex:1;display:flex;flex-direction:column"><span style="font-weight:600">حفظه يوم '+WEEKDAYS[d.getDay()]+' '+fmtG.format(d)+'</span><span class="small muted">الأسبوع '+PLAN[i].w+' · '+(st==='done'?'تم حفظه ✓':st?'مسجّل: '+({partial:'جزئي',missed:'لم يتم'}[st]):i<ti?'لم يُسجّل':'قادم')+'</span></span></button>'}).join('')+
      '<a class="small" href="'+quranUrl(q)+'" target="_blank" rel="noopener">افتح الوجه في المصحف</a></div>';
  }
  for(let w=1;w<=122;w++){
    const inf=weekInfo(w);const cls=w<cw?'past':w===cw?'cur':'';
    const open=V.openWeek===w;
    h+='<div class="card week-card'+(w===cw?' cur':'')+'" id="wk'+w+'"><button class="week-row" data-act="openWeek" data-v="'+w+'" aria-expanded="'+open+'"><span class="wnum '+cls+'">'+w+'</span><span style="flex:1;display:flex;flex-direction:column;gap:4px"><span class="row"><span style="font-weight:600;font-size:14px">'+(inf.lo?'حفظ الأوجه '+(inf.lo===inf.hi?inf.lo:inf.lo+' – '+inf.hi):'أسبوع تحضير ومراجعة')+(w===cw?' · الحالي':'')+'</span>'+(inf.pct!=null?'<b class="small" style="color:'+(inf.pct>=85?'var(--pri)':'var(--warn-ink)')+'">'+inf.pct+'%</b>':'')+'</span>'+
      (inf.pct!=null?'<span class="track" style="height:6px"><div style="width:'+inf.pct+'%;background:'+(inf.pct>=85?'var(--pri)':'var(--warn)')+'"></div></span>':'<span class="small muted">'+fmtGs.format(dateOf(inf.s))+' – '+fmtGs.format(dateOf(inf.s+6))+'</span>')+'</span></button>';
    if(open){for(let i=inf.s;i<inf.s+7;i++){const d=dateOf(i);const r=dayRatio(i);const col=!inPlan(i)?'var(--off)':r==null?'var(--off)':r>=1?'var(--pri)':r>0?'var(--gold)':i<ti?'var(--bad)':'transparent';
      h+='<button class="dayline" data-act="gotoDay" data-v="'+i+'"><b style="'+(i===ti?'color:var(--pri)':'')+'">'+WEEKDAYS[d.getDay()]+'<br><span class="small muted" style="font-weight:400">'+fmtGs.format(d)+'</span></b><span>'+daySummary(i)+'</span><span class="sm" style="background:'+col+';border:'+(col==='transparent'?'2px solid #A9B2AE':'0')+'"></span></button>'}}
    h+='</div>';
  }
  return h+'</div>';
}

/* ---------- Settings ---------- */
function viewSettings(){
  const ti=todayIdx();const s=S.settings;
  const pos=ti<firstIdx()?'الخطة تبدأ بعد '+(firstIdx()-ti)+' يوم':ti>=PLAN.length?'انتهت الخطة':'النهارده = الأسبوع '+PLAN[ti].w+' · اليوم '+(PLAN[ti].d+1);
  let h='<div class="page-head"><div style="display:flex;align-items:center;gap:4px"><button class="iconbtn plain" data-act="tab" data-v="plan" aria-label="رجوع">'+IC.prev+'</button><h1 class="amiri">الإعدادات</h1></div></div><div class="content">';
  h+='<div class="section-label">الخطة</div><div class="card list">'+
    '<label class="field"><span>تاريخ بداية الخطة</span><input type="date" id="set-start" value="'+esc(s.start)+'"></label>'+
    '<div style="padding:12px 14px"><div style="background:var(--pri-soft);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:4px"><b style="color:var(--pri);font-size:14px">'+pos+'</b><span class="small">الختم المتوقع: '+fmtG.format(dateOf(PLAN.length-1))+'</span></div></div>'+
    '<label class="field"><span style="display:flex;flex-direction:column"><span>ربط أيام الخطة بأيام الأسبوع</span><span class="small muted">الأسبوع يبدأ بالأحد، والجمعة والسبت بدون حفظ جديد زي الجدول</span></span><input type="checkbox" id="set-align"'+(s.align?' checked':'')+'></label></div>';
  if(s.align&&startDate().getDay()!==0)h+='<div class="small muted" style="padding:0 4px;line-height:1.7">تاريخ البداية يوم '+WEEKDAYS[startDate().getDay()]+'، فالأيام اللي قبله من الأسبوع الأول (من الأحد) مش هتتحسب عليك.</div>';
  h+='<div class="section-label">المظهر</div><div class="card"><label class="field"><span>الوضع</span><select id="set-theme"><option value="auto"'+(s.theme==='auto'?' selected':'')+'>تلقائي حسب الجوال</option><option value="light"'+(s.theme==='light'?' selected':'')+'>فاتح</option><option value="dark"'+(s.theme==='dark'?' selected':'')+'>داكن</option></select></label></div>';
  h+='<div class="section-label">بياناتي</div><div class="card list">'+
    '<button class="menu-btn" data-act="backup">'+IC.dl+'حفظ نسخة احتياطية</button>'+
    '<button class="menu-btn" data-act="restore">'+IC.up+'استرجاع نسخة احتياطية</button>'+
    '<button class="menu-btn" data-act="csv">'+IC.dl+'تصدير السجل كملف Excel</button>'+
    '<button class="menu-btn danger" data-act="reset">مسح كل التسجيلات</button></div>'+
    '<div class="small muted" style="padding:0 4px">آخر نسخة احتياطية: '+(S.lastBackup?fmtG.format(new Date(S.lastBackup)):'لم تُحفظ بعد')+'</div>'+
    '<input type="file" id="restore-file" accept="application/json,.json" hidden>';
  h+='<div class="section-label">التذكير</div><div class="card pad small" style="line-height:1.9">لتذكير ثابت كل يوم، اعمل منبّهين متكررين في ساعة الجوال: واحد لميعاد الحفظ الصبح وواحد للتحضير الليلي. التطبيق بيوريك المتأخرات أول ما تفتحه.</div>';
  h+='<div class="small muted" style="text-align:center;padding:12px">بياناتك محفوظة على جوالك فقط · إصدار '+APP_VERSION+'</div>';
  return h+'</div>';
}
function needBackupNudge(){const has=Object.keys(S.logs).length>0;if(!has)return false;const last=S.lastBackup?new Date(S.lastBackup):new Date(S.created);return Date.now()-last>7*DAY}

/* ---------- Files ---------- */
function download(name,text,type){const b=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function stamp(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function doBackup(){S.lastBackup=new Date().toISOString();save();download('hifz-backup-'+stamp()+'.json',JSON.stringify({app:'hifz-tracker',v:1,exported:S.lastBackup,data:S},null,1),'application/json');toast('تم حفظ النسخة في التنزيلات');render()}
function doCsv(){
  const st={done:'تم',partial:'جزئي',missed:'لم يتم'},q={good:'متقن',ok:'جيد',weak:'ضعيف'};
  const rows=[['التاريخ','الأسبوع','اليوم','الحصن','المهمة','المقرر','الحالة','العدد','الجودة','الأخطاء','السبب','تم قضاؤه','ملاحظة']];
  Object.keys(S.logs).map(Number).sort((a,b)=>a-b).forEach(i=>{const d=dateOf(i);for(const x of tasksOf(i)){const e=S.logs[i][x.id];if(!e)continue;
    rows.push([ymd(d),PLAN[i].w,WEEKDAYS[d.getDay()],x.f,x.title,x.sub,st[e.status]||'',e.count||'',q[e.quality]||'',e.mistakes||'',e.reason||'',e.resolved?'نعم':'',e.note||''])}});
  const csv='﻿'+rows.map(r=>r.map(c=>{c=String(c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(',')).join('\r\n');
  download('hifz-log-'+stamp()+'.csv',csv,'text/csv;charset=utf-8');toast('تم تصدير الملف');
}
function doRestore(file){
  const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);const d=o.data||o;if(!d.logs||!d.settings)throw 0;
    if(!confirm('استرجاع النسخة هيستبدل التسجيلات الحالية. متأكد؟'))return;
    S={...DEFAULT_STATE,...d,settings:{...DEFAULT_STATE.settings,...d.settings}};save();V.day=null;V.week=null;toast('تم الاسترجاع');render()}catch(e){toast('الملف ده مش نسخة احتياطية صحيحة')}};r.readAsText(file);
}

/* ---------- Events ---------- */
document.addEventListener('click',ev=>{
  const ov=ev.target.closest('.overlay');
  if(ov&&!ev.target.closest('[data-stop]')){closeSheet();return}
  const b=ev.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,v=b.dataset.v;
  if(a==='closeSheet')return;
  switch(a){
    case 'tab':V.tab=v;if(v==='plan')V.scrollWeek=V.openWeek;window.scrollTo(0,0);render();if(v==='plan'){const el=document.getElementById('wk'+V.openWeek);if(el)el.scrollIntoView({block:'center'})}break;
    case 'day':V.browsed=true;V.day=Math.min(Math.max(curDay()+(+v),firstIdx()),PLAN.length-1);render();break;
    case 'goToday':V.day=null;V.browsed=false;render();break;
    case 'peek':V.browsed=true;V.day=firstIdx();render();break;
    case 'gotoDay':V.day=+v;V.browsed=true;V.tab='today';window.scrollTo(0,0);render();break;
    case 'quick':{const i=curDay();const x=tasksOf(i).find(t=>t.id===b.dataset.id);const st=statusOf(i,x.id);
      if(x.detailed&&!st){openSheet(i,x.id);break}
      if(st==='done')setEntry(i,x.id,{status:null,count:0});else setEntry(i,x.id,{status:'done',count:x.target||undefined});
      render();break}
    case 'open':openSheet(curDay(),b.dataset.id);break;
    case 'sh-status':syncSheetInputs();SH.status=SH.status===v?null:v;if(SH.status==='done'&&SH.x.target)SH.count=SH.x.target;drawSheet();break;
    case 'sh-count':syncSheetInputs();SH.count=Math.max(0,Math.min(SH.x.target,SH.count+(+v)));SH.status=SH.count>=SH.x.target?'done':SH.count>0?'partial':SH.status==='done'||SH.status==='partial'?null:SH.status;drawSheet();break;
    case 'sh-q':syncSheetInputs();SH.quality=SH.quality===v?null:v;if(!SH.status)SH.status='done';drawSheet();break;
    case 'sh-m':syncSheetInputs();SH.mistakes=Math.max(0,SH.mistakes+(+v));drawSheet();break;
    case 'sh-r':syncSheetInputs();SH.reason=SH.reason===v?null:v;drawSheet();break;
    case 'sh-save':{syncSheetInputs();const p={status:SH.status,note:SH.note.trim()||undefined};
      if(SH.x.target)p.count=SH.count;if(SH.x.detailed){p.quality=SH.quality||undefined;p.mistakes=SH.mistakes||undefined}
      if(SH.status==='partial'||SH.status==='missed'){p.reason=SH.reason||undefined;p.carry=SH.carry}else{p.reason=undefined;p.carry=undefined;p.resolved=undefined}
      setEntry(SH.i,SH.x.id,p);closeSheet();render();toast('تم الحفظ');break}
    case 'sh-clear':setEntry(SH.i,SH.x.id,{status:null,count:0,note:'',quality:undefined,mistakes:undefined,reason:undefined});closeSheet();render();break;
    case 'weak':V.day=+v;V.browsed=true;V.tab='today';render();openSheet(+v,'new');break;
    case 'allBl':V.allBl=!V.allBl;render();break;
    case 'week':V.week=Math.min(122,Math.max(1,V.week+(+v)));render();break;
    case 'resolve':setEntry(+b.dataset.i,b.dataset.id,{resolved:new Date().toISOString()});render();toast('تم — الله يبارك فيك');break;
    case 'openWeek':V.openWeek=V.openWeek===+v?-1:+v;render();break;
    case 'backup':doBackup();break;
    case 'csv':doCsv();break;
    case 'restore':$('#restore-file').click();break;
    case 'reset':if(confirm('هيتم مسح كل التسجيلات نهائيًا. خذ نسخة احتياطية الأول. متأكد؟')){S.logs={};save();render();toast('تم المسح')}break;
  }
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='set-start'&&t.value){S.settings.start=t.value;V.day=null;V.week=null;V.openWeek=null;save();render()}
  if(t.id==='set-align'){S.settings.align=t.checked;V.day=null;V.week=null;V.openWeek=null;save();render()}
  if(t.id==='set-theme'){S.settings.theme=t.value;save();render()}
  if(t.id==='restore-file'&&t.files[0])doRestore(t.files[0]);
});
let qT;document.addEventListener('input',ev=>{if(ev.target.id==='q'){V.q=ev.target.value;clearTimeout(qT);qT=setTimeout(()=>{render();const el=$('#q');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}window.scrollTo(0,0)},350)}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&SH)closeSheet()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!SH){if(!V.browsed)V.day=null;render()}});
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>applyTheme())}catch(e){}

render();
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
</body>
</html>
